# Local ducat stack: ducat -> Prometheus -> Grafana, all on your machine.
#
# Why this exists: to look at real billing data without pushing anything into a
# shared/production observability stack. Nothing here talks to a remote sink;
# Prometheus scrapes ducat locally and Grafana reads that local Prometheus.
#
#   make -C ../.. local-up      # start
#   open http://localhost:3000  # Grafana, anonymous admin, dashboard pre-loaded
#   make -C ../.. local-down    # stop
#
# Credentials: ducat authenticates to GCP with Application Default Credentials.
# We mount ~/.config/gcloud READ-ONLY so the container reuses the ADC you already
# created with `gcloud auth application-default login`. No keys are copied, and
# nothing is written back.

name: ducat-local

services:
  ducat:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["serve", "--config", "/etc/ducat/config.yaml", "--port", "9090"]
    # Your estate's coordinates (project, dataset, billing account) come from .env
    # and are read by the ${VAR} references in ducat-config.yaml. Compose reads .env
    # for its OWN interpolation automatically, but does not pass it to containers,
    # so this is required, not redundant. Optional so a fresh clone still starts.
    env_file:
      - path: .env
        required: false
    environment:
      # ADC inside the container. Path is where the mount lands, not the host path.
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      # Billing/quota project for client libraries; harmless if already in ADC.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ./ducat-config.yaml:/etc/ducat/config.yaml:ro
      - ${HOME}/.config/gcloud:/gcloud:ro
      # Historical Console CSVs, mounted at the SAME path the Kubernetes deploy
      # uses (/var/lib/ducat/billing-csv). Local uses a bind mount, the cluster
      # uses a PVC or a GCS sync, and the adapter cannot tell the difference , so
      # there is one code path instead of a local-only branch.
      # Override the host side with BILLING_CSV_DIR to point at a scratch folder.
      - ${BILLING_CSV_DIR:-./billing-csv}:/var/lib/ducat/billing-csv:ro
    expose:
      - "9090"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9091:9090"   # 9091 on the host so it can't collide with a local Prom
    depends_on:
      - ducat
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Local-only convenience: no login wall. Do NOT copy this to a shared deploy.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
