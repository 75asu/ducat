image:
  repository: ghcr.io/75asu/ducat
  tag: ""                      # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# How ducat runs:
#   serve   = long-running /metrics endpoint, scraped by Prometheus (a Deployment)
#   cronjob = one-shot fetch + remote_write push on a schedule (a CronJob)
mode: serve

serve:
  port: 9090
  refreshInterval: 3600        # seconds between cost-API refreshes

cronjob:
  schedule: "0 * * * *"
  restartPolicy: Never

# Rendered verbatim into a ConfigMap as config.yaml.
# Secrets are NOT here , provider tokens come from envFrom (an existing Secret).
config:
  providers:
    github:
      enabled: true
      org: my-org
      token_env: GITHUB_TOKEN
    # aws:                       # needs ce:GetCostAndUsage; creds via the ambient chain
    #   enabled: true            # (IRSA / OIDC role / env). Services auto-detected.
    #   # usage_record_types: ["Usage"]   # show consumed value on credit-funded accounts
    # cloudflare:
    #   enabled: true
    #   account_id: "<cf-account-id>"
    #   token_env: CLOUDFLARE_API_TOKEN   # account token with Billing: Read
    # gcp:                       # reads the Cloud Billing BigQuery export (no cost API
    #   enabled: true            # exists); creds via Workload Identity on the SA below.
    #   source: focus            # or `standard` (GA, durable, adapter does the mapping)
    #   project: <project-holding-the-export>
    #   dataset: <dataset>       # focus: gcp_billing_immutable_<ACCT_UNDERSCORED>_<region>
    #   billing_account_id: "<XXXXXX-XXXXXX-XXXXXX>"
    #   # Months predating the export, from Console "Cost table" CSVs. The export is
    #   # forward-only (it backfills the current + previous month and nothing more),
    #   # so earlier months exist only as CSVs. Mount them here via extraVolumes.
    #   csv_dir: /var/lib/ducat/billing-csv
  sink:
    remote_write:
      url: ""                  # required for cronjob mode
      tenant: ""               # X-Scope-OrgID

# Inject provider tokens from an existing Secret, e.g.
#   envFrom:
#     - secretRef: { name: ducat-secrets }
envFrom: []
env: []

# Extra volumes on the ducat pod (serve Deployment and cronjob Job alike).
#
# The case this exists for: `providers.gcp.csv_dir` reads historical Console CSV
# exports off the filesystem, which is unreachable in a container without a volume.
# Any source works, and the trade-offs differ:
#
#   configMap  simplest, no extra infra, but capped at ~1 MiB total. A single
#              month of a mid-size estate is ~200 KiB, so this covers a handful of
#              months and then stops. Fine for a one-time historical backfill.
#   pvc        no size limit, survives restarts, but needs the files put there once
#              (a Job, or kubectl cp).
#   csi        object-storage mounts (GCS/S3 CSI drivers) keep the files in a bucket
#              where they are versioned and auditable. Best if you have the driver.
#
# Mount read-only: ducat never writes here.
#
# extraVolumes:
#   - name: billing-csv
#     configMap:
#       name: ducat-billing-csv        # kubectl create configmap ducat-billing-csv --from-file=...
# extraVolumeMounts:
#   - name: billing-csv
#     mountPath: /var/lib/ducat/billing-csv
#     readOnly: true
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""
  annotations: {}              # AWS IRSA / GCP Workload Identity for keyless cloud adapters

serviceMonitor:
  enabled: false               # set true on a Prometheus-Operator cluster (serve mode)
  interval: 1h
  labels: {}
  # Keep ducat's exposed labels (provider/service/billing_account) over the
  # target labels Prometheus stamps; `service` collides with the k8s Service
  # name otherwise. Almost always want this true for this exporter.
  honorLabels: true
  # Drop the `pod`/`instance` labels the Operator stamps at scrape: across pod
  # restarts and replicas they differ and the same cost series double-counts.
  dropTargetLabels: true

# Ship guardrail alerts as a PrometheusRule (serve mode). Fires when the exporter
# is unreachable, exposes no cost data, or is logging fetch errors , so a stalled
# scrape can't blank the board silently. Needs the Prometheus Operator CRDs.
prometheusRule:
  enabled: false               # set true on a Prometheus-Operator cluster (pairs with serviceMonitor)
  labels: {}                   # e.g. { release: kube-prometheus-stack } so the Operator selects the rule
  # How long a bad condition must hold before the alert fires.
  for: 15m

# Ship the Grafana dashboard as a sidecar-labeled ConfigMap (auto-imported by the
# Grafana kiwigrid sidecar). Set folder to drop it into an RBAC-restricted folder.
dashboards:
  enabled: true
  sidecarLabel: grafana_dashboard
  sidecarLabelValue: "1"
  folder: ""                   # e.g. "FinOps" , restrict that folder to an SRE+CXO team in Grafana

resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
