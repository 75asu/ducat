# Local-only Prometheus. Scrapes ducat and nothing else.
# Billing data lands T+1, so a fast scrape buys nothing: 5m is already
# far more often than the data changes.
global:
  scrape_interval: 5m
  scrape_timeout: 2m          # a BigQuery query is slow by wire standards
  external_labels:
    env: local

scrape_configs:
  - job_name: ducat
    static_configs:
      - targets: ["ducat:9090"]
